{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'authentications/css/login.css' %}">
{% endblock extra_css %}

{% block content %}
      {% if messages %}
         {% for message in messages %}
            <div class="custom-message alert" role="alert">
                  <i class="bi bi-check-circle-fill"></i>
                  <span>{{ message }}</span>

                  <button
                     type="button"
                     class="btn-close"
                     data-bs-dismiss="alert"
                     onclick="this.parentElement.remove()"
                     aria-label="Close">
                  </button>
            </div>
         {% endfor %}
      {% endif %}
<div class="login-container">

    <div class="login-card">
        <h1>Login</h1>
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>
            <button type="submit">
                Login
            </button>
        </form>
        <!-- Signup Option --> 
         <div class="signup-option"> 
            <span>Don't have an account?</span> 
            <a href="{% url 'signup' %}">Sign Up</a> 
        </div>
    </div>
</div>

{% endblock content %}
